name: Changesets

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push the version commit
      pull-requests: write  # Required to open the Release PR
      id-token: write       # <--- REQUIRED for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          # Note: We do NOT need to set NODE_AUTH_TOKEN here because
          # 'id-token: write' above handles the authentication automatically.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Create Release Pull Request / Publish
      #   uses: changesets/action@v1
      #   with:
      #     publish: pnpm release
      #     version: pnpm version-packages
      #     commit: 'chore: version packages'
      #     title: 'chore: version packages'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release Pull Request / Publish
        uses: changesets/action@v1
        with:
          # We ignore the 'release' script in package.json and run the commands manually here
          publish: pnpm build && pnpm verify:package && rm pnpm-lock.yaml && npx changeset publish
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}